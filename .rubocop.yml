inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-performance
  - rubocop-minitest

AllCops:
  TargetRubyVersion: 3.1
  NewCops: pending
  Exclude:
    - 'samples/**/*'
    - 'lib/llvm/config.rb'
    - 'tmp/*'
    - vendor/bundle/**/*
    - lib/llvm/core/pass_manager.rb
    - test/pass_manager_builder_test.rb
    - lib/llvm/transforms/**

# New cops: enable pending cops added up to these versions. Newer cops stay
# pending and RuboCop warns about them. Plugin departments use the plugin's
# version. Style is pinned in its section under "Exceptions".
Gemspec:
  NewCops: '1.92'

Layout:
  NewCops: '1.92'

Lint:
  NewCops: '1.92'

Metrics:
  NewCops: '1.92'

Naming:
  NewCops: '1.92'

Security:
  NewCops: '1.92'

Performance:
  NewCops: '1.26' # rubocop-performance

Minitest:
  NewCops: '0.40' # rubocop-minitest

# Style
Style/ClassAndModuleChildren:
  Enabled: false

Style/NegatedIf:
  Enabled: false

Style/IfUnlessModifier:
  Enabled: false

Style/NegatedWhile:
  Enabled: false

Style/FrozenStringLiteralComment:
  Exclude:
    - lib/llvm/**/*_ffi.rb

Style/Alias:
  EnforcedStyle: prefer_alias_method

# Layout
Layout/EndAlignment:
  AutoCorrect: true
  EnforcedStyleAlignWith: variable

Layout/EmptyLineAfterGuardClause:
  Enabled: false

Layout/HashAlignment:
  Enabled: false

Layout/CaseIndentation:
  Enabled: true
  EnforcedStyle: end

Layout/ArgumentAlignment:
  EnforcedStyle: with_fixed_indentation

# Exceptions
Style:
  NewCops: '1.92'
  Exclude:
    - 'lib/**/*ffi.rb'

Layout/IndentationWidth:
  Exclude:
    - 'lib/**/*ffi.rb'

Style/RedundantBegin:
  Exclude:
    - 'lib/**/*ffi.rb'
    - 'ext/ruby-llvm-support/Rakefile'

# Naming
Naming/MethodName:
  Enabled: false

Naming/VariableNumber:
  Enabled: false

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: consistent_comma
  Exclude:
    - 'lib/**/*ffi.rb'
    - 'ext/ruby-llvm-support/Rakefile'

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: consistent_comma
  Exclude:
    - 'lib/**/*ffi.rb'
    - 'ext/ruby-llvm-support/Rakefile'

# Metrics

Metrics/ClassLength:
  Max: 220
  CountAsOne: ['array', 'hash']
  Exclude:
    - 'lib/llvm/core/builder.rb'

# Gemspec

# Not sold on usefulness: https://github.com/rubocop/rubocop/pull/11469
Gemspec/DevelopmentDependencies:
  Enabled: false

Style/AccessModifierDeclarations:
  Enabled: false

# this one is wrong
Style/DoubleNegation:
  Enabled: false

Style/YodaCondition:
  Enabled: false

Style/TrailingUnderscoreVariable:
  Enabled: false

Minitest/EmptyLineBeforeAssertionMethods:
  Enabled: false

Naming/PredicateMethod:
  Enabled: false

Layout/LeadingCommentSpace:
  AllowRBSInlineAnnotation: true
