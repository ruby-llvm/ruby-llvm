name: Matrix Testing

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# a new run on the same branch or PR cancels the one still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, macos-15, macos-15-intel, macos-26, macos-26-intel]
        ruby: ['3.1', '3.2', '3.3', '3.4', '4.0']
        exclude:
          - os: ubuntu-26.04
            ruby: '3.1'
    continue-on-error: ${{ endsWith(matrix.ruby, 'head') || matrix.ruby == 'debug' }}
    env:
      # the tests do not need these Gemfile groups; see the Gemfile
      BUNDLE_WITHOUT: lint:debug
    steps:
      - name: Homebrew cache key
        if: startsWith(matrix.os, 'macos')
        id: brew_cache
        run: |
          echo "dir=$(brew --cache)" >> "$GITHUB_OUTPUT"
          echo "llvm=$(brew info --json=v2 llvm@22 | jq -r '.formulae[0] | "\(.versions.stable)_\(.revision)"')" >> "$GITHUB_OUTPUT"
      - name: Cache Homebrew downloads
        if: startsWith(matrix.os, 'macos')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.brew_cache.outputs.dir }}/downloads
          key: brew-downloads-${{ matrix.os }}-llvm@22-${{ steps.brew_cache.outputs.llvm }}
      - name: Install LLVM on macos
        if: startsWith(matrix.os, 'macos')
        id: macos_setup
        run: |
          echo "setup=false" >> "$GITHUB_OUTPUT"
          # brew update --auto-update
          brew install llvm@22
          echo "$(brew --prefix llvm@22)/bin" >> $GITHUB_PATH
          sudo mkdir -p /opt/local/
          sudo ln -s $(brew --prefix llvm@22)/lib /opt/local/lib
          # ffi will only look for files in a small set of directories, so llvm needs to be there
          # https://github.com/ffi/ffi/blob/master/lib/ffi/dynamic_library.rb#L33
          # /usr/lib /usr/local/lib /opt/local/lib /opt/homebrew/lib
          # this uses /opt/local/lib -> /usr/local/opt/llvm/lib
          echo "setup=true" >> "$GITHUB_OUTPUT"
      - name: 'MacOS debug'
        if: steps.macos_setup.setup == 'false'
        run: |
          echo $(brew --repository)
          echo $(brew --prefix llvm@22)
          echo $(brew info llvm@22)
          echo "$PATH"
          echo $(llvm-config --ldflags)
          ls -l $(brew --prefix llvm@22)/lib/libLLVM.dylib
          ls -l /opt/local/lib/libLLVM.dylib
      - name: Install LLVM on ubuntu
        id: ubuntu_setup
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          echo "setup=false" >> "$GITHUB_OUTPUT"
          # Add the apt.llvm.org repository as llvm.sh does, but skip llvm.sh's
          # fixed package list (clang, lldb, lld, clangd), which has no option
          # to install less.
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          codename=$(lsb_release -cs)
          # add-apt-repository runs apt-get update itself
          sudo add-apt-repository -y "deb https://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-22 main"
          # headers, llvm-config-22 and libLLVM; the support library builds with
          # the runner's own C++ compiler, as it would on a user's machine
          sudo apt-get install -y --no-install-recommends llvm-22-dev
          # sudo apt-get install -y libpolly-22-dev
          echo "setup=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.macos_setup.outputs.setup == 'true' || steps.ubuntu_setup.outputs.setup == 'true'
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        if: steps.macos_setup.outputs.setup == 'true' || steps.ubuntu_setup.outputs.setup == 'true'
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: cd ext/ruby-llvm-support && bundle exec rake
        name: "Build support library"
        if: steps.macos_setup.outputs.setup == 'true' || steps.ubuntu_setup.outputs.setup == 'true'
      - run: bundle exec rake
        name: "Run tests"
        if: steps.macos_setup.outputs.setup == 'true' || steps.ubuntu_setup.outputs.setup == 'true'
      - run: bundle exec rake test:samples
        name: "Run samples"
        if: steps.macos_setup.outputs.setup == 'true' || steps.ubuntu_setup.outputs.setup == 'true'
      # Runs sorbet-static's binary directly. The srb wrapper is in the sorbet
      # gem.
      - name: "Typecheck"
        run: '"$(bundle info --path sorbet-static)/libexec/sorbet"'
        if: steps.macos_setup.outputs.setup == 'true' || steps.ubuntu_setup.outputs.setup == 'true'
      # Build the gem and install it as a user would: outside Bundler, building
      # the support library and lib/llvm/config.rb at install time. GEM_PATH is
      # only the new GEM_HOME, so ffi and rake must come from rubygems.org
      # through the gem's own dependencies. The check runs outside the checkout,
      # so only the installed gem can be loaded.
      - name: "Build and install gem"
        if: steps.macos_setup.outputs.setup == 'true' || steps.ubuntu_setup.outputs.setup == 'true'
        env:
          GEM_HOME: ${{ runner.temp }}/gem-install
          GEM_PATH: ${{ runner.temp }}/gem-install
        run: |
          gem build ruby-llvm.gemspec --output "$RUNNER_TEMP/ruby-llvm.gem"
          gem install --no-document "$RUNNER_TEMP/ruby-llvm.gem"
          cd "$RUNNER_TEMP"
          ruby -e '
            require "llvm/core"
            require "llvm/config"
            spec = Gem.loaded_specs.fetch("ruby-llvm")
            abort "loaded #{spec.full_gem_path}, not the installed gem" unless spec.full_gem_path.start_with?(ENV.fetch("GEM_HOME"))
            type = LLVM::Int32.type.debug_s
            abort "support library: Type#debug_s returned #{type.inspect}" unless type == "i32"
            puts "installed ruby-llvm #{spec.version} for LLVM #{LLVM::CONFIG::VERSION}"
          '
